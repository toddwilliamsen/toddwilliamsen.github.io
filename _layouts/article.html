---
layout: default
---
<article class="article">
  <header class="article-hero">
    <div class="shell">
      <p class="eyebrow">
        <a href="{{ '/#writing' | relative_url }}">Writing</a>
        {% if page.topic %}
          <span aria-hidden="true">/</span>
          <span>{{ page.topic }}</span>
        {% endif %}
      </p>
      <h1>{{ page.title }}</h1>
      {% if page.summary %}
        <p class="lede">{{ page.summary }}</p>
      {% endif %}
      <p class="meta">
        <span>{{ page.author | default: site.author }}</span>
        {% if page.date %}
          <span aria-hidden="true">·</span>
          <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%B %-d, %Y' }}</time>
        {% endif %}
      </p>
    </div>
  </header>

  <div class="shell article-body prose">
    {{ content }}
  </div>
</article>
