<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title">
  <title id="title">App roles vs group claims</title>
  <style>
    .bg { fill: #f0f3f7; }
    .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
    .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
    .panel-ink { fill: #101820; }
    .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 20px; font-weight: 700; fill: #101820; }
    .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #101820; }
    .label-inv { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 12px; font-weight: 700; fill: #f7f9fb; }
    .sub { font-family: Source Serif 4, Georgia, serif; font-size: 12px; fill: #3d4a5c; }
    .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 11px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
    .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.8; stroke-dasharray: 7 11; }
    .dot { fill: #9a4e1a; }
  </style>
  <rect class="bg" width="960" height="480"/>
  <text class="title" x="40" y="40">Authorization: App Roles vs Group Claims</text>
  <text class="sub" x="40" y="64">Roles live on the app registration; groups come from the directory</text>

  <rect class="panel" x="40" y="120" width="200" height="120" rx="3"/>
  <text class="tiny" x="58" y="150">USER</text>
  <text class="label" x="58" y="180">Signed-in user</text>
  <text class="sub" x="58" y="208">Member of groups</text>

  <path class="wire-accent" d="M240 180 H290"/>
  <polygon points="290,172 302,180 290,188" class="dot"/>

  <rect class="panel-ink" x="310" y="100" width="300" height="300" rx="3"/>
  <text class="tiny" x="330" y="130" style="fill:#c5d0dc">TOKEN</text>
  <text class="label-inv" x="330" y="165">roles claim</text>
  <text class="sub" x="330" y="195" style="fill:#c5d0dc">Admin, Reader, Writer</text>
  <text class="sub" x="330" y="220" style="fill:#c5d0dc">Defined in app manifest</text>
  <text class="label-inv" x="330" y="270">groups claim</text>
  <text class="sub" x="330" y="300" style="fill:#c5d0dc">Object IDs of groups</text>
  <text class="sub" x="330" y="325" style="fill:#c5d0dc">Can oversize the token</text>
  <text class="sub" x="330" y="350" style="fill:#c5d0dc">Prefer roles for app authZ</text>

  <path class="wire-accent" d="M610 220 H660"/>
  <polygon points="660,212 672,220 660,228" class="dot"/>

  <rect class="panel-accent" x="680" y="150" width="240" height="200" rx="3"/>
  <text class="tiny" x="700" y="180">YOUR API / APP</text>
  <text class="label" x="700" y="210">Authorize</text>
  <text class="sub" x="700" y="240">Check roles first</text>
  <text class="sub" x="700" y="265">Map groups carefully</text>
  <text class="sub" x="700" y="290">Least privilege</text>
</svg>
