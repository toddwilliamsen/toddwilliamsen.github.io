<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title">
  <title id="title">Diagnostics to Log Analytics</title>
  <style>
    .bg { fill: #f0f3f7; }
    .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
    .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
    .panel-ink { fill: #101820; }
    .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 22px; font-weight: 700; fill: #101820; }
    .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #101820; }
    .sub { font-family: Source Serif 4, Georgia, serif; font-size: 12px; fill: #3d4a5c; }
    .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 11px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
    .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.8; stroke-dasharray: 7 11; }
    .dot { fill: #9a4e1a; }
    .on-ink { fill: #c5d0dc; }
    .on-ink-label { fill: #f0f3f7; }
  </style>

  <rect class="bg" width="960" height="520"/>
  <text class="title" x="40" y="44">Diagnostics to Log Analytics</text>
  <text class="sub" x="40" y="68">Resource diagnostic settings + Activity log into one workspace</text>

  <rect class="panel" x="40" y="130" width="200" height="100" rx="3"/>
  <text class="tiny" x="58" y="160">RESOURCE</text>
  <text class="label" x="58" y="190">Key Vault</text>
  <text class="sub" x="58" y="212">AuditEvent</text>

  <rect class="panel" x="40" y="260" width="200" height="100" rx="3"/>
  <text class="tiny" x="58" y="290">CONTROL PLANE</text>
  <text class="label" x="58" y="320">Activity log</text>
  <text class="sub" x="58" y="342">Administrative</text>

  <path class="wire-accent" d="M240 180 H320"/>
  <polygon points="320,172 332,180 320,188" class="dot"/>
  <path class="wire-accent" d="M240 310 H320"/>
  <polygon points="320,302 332,310 320,318" class="dot"/>

  <rect class="panel-accent" x="340" y="170" width="220" height="150" rx="3"/>
  <text class="tiny" x="358" y="200">DIAG SETTINGS</text>
  <text class="label" x="358" y="230">Categories on</text>
  <text class="sub" x="358" y="254">Destination = LAW</text>
  <text class="sub" x="358" y="276">Per resource + sub</text>

  <path class="wire-accent" d="M560 245 H640"/>
  <polygon points="640,237 652,245 640,253" class="dot"/>

  <rect class="panel-ink" x="660" y="140" width="260" height="260" rx="3"/>
  <text class="tiny on-ink" x="680" y="175">WORKSPACE</text>
  <text class="label on-ink-label" x="680" y="210">law-lab-001</text>
  <text class="sub on-ink" x="680" y="240">AzureDiagnostics</text>
  <text class="sub on-ink" x="680" y="262">AzureActivity</text>
  <text class="sub on-ink" x="680" y="300">Kusto queries</text>
  <text class="sub on-ink" x="680" y="322">Watch ingest cost</text>
</svg>
