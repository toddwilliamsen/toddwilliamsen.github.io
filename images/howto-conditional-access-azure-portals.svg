<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title">
  <title id="title">Conditional Access for Azure management</title>
  <style>
    .bg { fill: #f0f3f7; }
    .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
    .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
    .panel-ink { fill: #101820; }
    .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 22px; font-weight: 700; fill: #101820; }
    .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #101820; }
    .sub { font-family: Source Serif 4, Georgia, serif; font-size: 12px; fill: #3d4a5c; }
    .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 11px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
    .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.8; stroke-dasharray: 7 11; }
    .dot { fill: #9a4e1a; }
  </style>

  <rect class="bg" width="960" height="520"/>
  <text class="title" x="40" y="44">CA for Azure Portals and CLI</text>
  <text class="sub" x="40" y="68">Report-only - MFA grant - exclude break-glass - then On</text>

  <rect class="panel" x="40" y="140" width="200" height="130" rx="3"/>
  <text class="tiny" x="58" y="170">CLIENTS</text>
  <text class="label" x="58" y="200">Portal + az CLI</text>
  <text class="sub" x="58" y="224">Azure Management</text>
  <text class="sub" x="58" y="246">cloud app target</text>

  <path class="wire-accent" d="M240 205 H300"/>
  <polygon points="300,197 312,205 300,213" class="dot"/>

  <rect class="panel-accent" x="320" y="120" width="280" height="170" rx="3"/>
  <text class="tiny" x="338" y="150">CONDITIONAL ACCESS</text>
  <text class="label" x="338" y="180">Require MFA</text>
  <text class="sub" x="338" y="204">Include: admin pilot SG</text>
  <text class="sub" x="338" y="226">Exclude: sg-break-glass</text>
  <text class="sub" x="338" y="248">Mode: Report-only then On</text>

  <path class="wire-accent" d="M600 205 H660"/>
  <polygon points="660,197 672,205 660,213" class="dot"/>

  <rect class="panel-ink" x="680" y="120" width="240" height="170" rx="3"/>
  <text class="tiny" x="698" y="150" style="fill:#c5d0dc">OUTCOME</text>
  <text class="label" x="698" y="185" style="fill:#f0f3f7">Stronger tokens</text>
  <text class="sub" x="698" y="215" style="fill:#c5d0dc">Humans challenged</text>
  <text class="sub" x="698" y="237" style="fill:#c5d0dc">Automation uses MI</text>

  <rect class="panel" x="40" y="340" width="880" height="120" rx="3"/>
  <text class="tiny" x="58" y="370">SAFETY</text>
  <text class="label" x="58" y="400">Break-glass excluded and monitored before enforce</text>
  <text class="sub" x="58" y="428">Validate sign-in logs for portal and az login during report-only</text>
</svg>
