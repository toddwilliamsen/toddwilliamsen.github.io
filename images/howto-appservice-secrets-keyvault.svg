<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title">
  <title id="title">App Service secrets in Key Vault</title>
  <style>
    .bg { fill: #f0f3f7; }
    .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
    .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
    .panel-ink { fill: #101820; }
    .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 20px; font-weight: 700; fill: #101820; }
    .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #101820; }
    .label-inv { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 12px; font-weight: 700; fill: #f7f9fb; }
    .sub { font-family: Source Serif 4, Georgia, serif; font-size: 12px; fill: #3d4a5c; }
    .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 11px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
    .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.8; stroke-dasharray: 7 11; }
    .dot { fill: #9a4e1a; }
  </style>
  <rect class="bg" width="960" height="460"/>
  <text class="title" x="40" y="40">Web App Secrets in Key Vault</text>
  <text class="sub" x="40" y="64">Managed identity + Key Vault reference - no secrets in git or plain app settings</text>

  <rect class="panel-accent" x="40" y="140" width="260" height="200" rx="3"/>
  <text class="tiny" x="60" y="170">APP SERVICE</text>
  <text class="label" x="60" y="200">Web App</text>
  <text class="sub" x="60" y="230">System-assigned MI</text>
  <text class="sub" x="60" y="255">App setting = @Microsoft...</text>
  <text class="sub" x="60" y="280">KeyVault reference</text>

  <path class="wire-accent" d="M300 240 H360"/>
  <polygon points="360,232 372,240 360,248" class="dot"/>

  <rect class="panel-ink" x="380" y="120" width="280" height="240" rx="3"/>
  <text class="tiny" x="400" y="150" style="fill:#c5d0dc">KEY VAULT</text>
  <text class="label-inv" x="400" y="185">Secret store</text>
  <text class="sub" x="400" y="220" style="fill:#c5d0dc">Access policy / RBAC</text>
  <text class="sub" x="400" y="245" style="fill:#c5d0dc">Get + List for MI only</text>
  <text class="sub" x="400" y="285" style="fill:#c5d0dc">Rotation without redeploy</text>

  <path class="wire-accent" d="M660 240 H720"/>
  <polygon points="720,232 732,240 720,248" class="dot"/>

  <rect class="panel" x="740" y="160" width="180" height="160" rx="3"/>
  <text class="tiny" x="760" y="190">NOT HERE</text>
  <text class="label" x="760" y="220">Git repo</text>
  <text class="sub" x="760" y="250">No client secrets</text>
  <text class="sub" x="760" y="275">No connection strings</text>
</svg>
