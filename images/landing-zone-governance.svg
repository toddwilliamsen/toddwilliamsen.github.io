<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title">
  <title id="title">Landing zone governance hierarchy</title>
  
<style>
  .bg { fill: #f0f3f7; }
  .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
  .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
  .panel-ink { fill: #101820; }
  .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 22px; font-weight: 700; fill: #101820; }
  .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #101820; letter-spacing: 0.02em; }
  .label-inv { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #f7f9fb; }
  .sub { font-family: Source Serif 4, Georgia, serif; font-size: 12px; fill: #3d4a5c; }
  .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 11px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
  .wire { fill: none; stroke: #101820; stroke-width: 1.4; stroke-opacity: 0.35; }
  .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.8; }
  .dot { fill: #9a4e1a; }

  .wire-accent, .flow {
    stroke-dasharray: 7 11;
    animation: viz-flow 2.8s linear infinite;
  }
  .wire {
    stroke-dasharray: 3 9;
    animation: viz-flow 9s linear infinite;
  }
  .panel-accent, .dot, .node-pulse {
    animation: viz-pulse 3.2s ease-in-out infinite;
  }
  @keyframes viz-flow {
    to { stroke-dashoffset: -72; }
  }
  @keyframes viz-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  @media (prefers-reduced-motion: reduce) {
    .wire-accent, .flow, .wire, .panel-accent, .dot, .node-pulse { animation: none; }
  }

</style>

  <rect class="bg" width="960" height="540"/>
  
  <text class="title" x="40" y="48">Governance Guardrails</text>
  <text class="sub" x="40" y="72">Policy turns architecture decisions into enforceable controls</text>

  <rect class="panel-ink" x="300" y="100" width="360" height="54" rx="3"/>
  <text class="label-inv" x="360" y="133">Tenant Root Management Group</text>

  <path class="wire" d="M480 154 V180"/>
  <path class="wire" d="M180 180 H780"/>
  <path class="wire" d="M180 180 V210"/>
  <path class="wire" d="M480 180 V210"/>
  <path class="wire" d="M780 180 V210"/>

  <rect class="panel" x="70" y="210" width="220" height="70" rx="3"/>
  <text class="label" x="95" y="252">Platform</text>

  <rect class="panel-accent" x="370" y="210" width="220" height="70" rx="3"/>
  <text class="label" x="400" y="252">Landing Zones</text>

  <rect class="panel" x="670" y="210" width="220" height="70" rx="3"/>
  <text class="label" x="720" y="252">Sandbox</text>

  <path class="wire-accent" d="M480 280 V310"><animate attributeName="stroke-dashoffset" values="0;-72" dur="2.8s" repeatCount="indefinite"/></path>

  <rect class="panel" x="80" y="310" width="250" height="180" rx="3"/>
  <text class="tiny" x="100" y="340">POLICY EFFECTS</text>
  <text class="label" x="100" y="372">Deny</text>
  <text class="sub" x="100" y="396">Public storage, open NSGs</text>
  <text class="label" x="100" y="430">DeployIfNotExists</text>
  <text class="sub" x="100" y="454">Diagnostics, Defender</text>

  <rect class="panel" x="355" y="310" width="250" height="180" rx="3"/>
  <text class="tiny" x="375" y="340">REQUIRED BASELINE</text>
  <text class="sub" x="375" y="372">Allowed regions only</text>
  <text class="sub" x="375" y="396">CMK / encryption rules</text>
  <text class="sub" x="375" y="420">Required resource tags</text>
  <text class="sub" x="375" y="444">No owner at sub by default</text>
  <text class="sub" x="375" y="468">Private endpoint preference</text>

  <rect class="panel" x="630" y="310" width="250" height="180" rx="3"/>
  <text class="tiny" x="650" y="340">OPERATING SIGNAL</text>
  <text class="sub" x="650" y="372">Compliance dashboards</text>
  <text class="sub" x="650" y="396">Exemption workflow</text>
  <text class="sub" x="650" y="420">Subscription vending</text>
  <text class="sub" x="650" y="444">Owner + cost center tags</text>
  <text class="sub" x="650" y="468">Quarterly access review</text>

</svg>
