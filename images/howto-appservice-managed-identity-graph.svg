<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title">
  <title id="title">Managed identity instead of client secrets</title>
  <style>
    .bg { fill: #f0f3f7; }
    .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
    .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
    .panel-ink { fill: #101820; }
    .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 20px; font-weight: 700; fill: #101820; }
    .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #101820; }
    .label-inv { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 12px; font-weight: 700; fill: #f7f9fb; }
    .sub { font-family: Source Serif 4, Georgia, serif; font-size: 12px; fill: #3d4a5c; }
    .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 11px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
    .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.8; stroke-dasharray: 7 11; }
    .dot { fill: #9a4e1a; }
  </style>
  <rect class="bg" width="960" height="460"/>
  <text class="title" x="40" y="40">Managed Identity Instead of Client Secrets</text>
  <text class="sub" x="40" y="64">App Service MI acquires tokens - no secret rotation for Graph or resource APIs</text>

  <rect class="panel-accent" x="40" y="130" width="260" height="220" rx="3"/>
  <text class="tiny" x="60" y="160">APP SERVICE</text>
  <text class="label" x="60" y="190">Web App + MI</text>
  <text class="sub" x="60" y="220">DefaultAzureCredential</text>
  <text class="sub" x="60" y="245">No client secret</text>
  <text class="sub" x="60" y="270">No cert in app settings</text>

  <path class="wire-accent" d="M300 220 H360"/>
  <polygon points="360,212 372,220 360,228" class="dot"/>

  <rect class="panel-ink" x="380" y="120" width="260" height="240" rx="3"/>
  <text class="tiny" x="400" y="150" style="fill:#c5d0dc">ENTRA</text>
  <text class="label-inv" x="400" y="185">Token endpoint</text>
  <text class="sub" x="400" y="220" style="fill:#c5d0dc">Managed identity SP</text>
  <text class="sub" x="400" y="245" style="fill:#c5d0dc">App role / Graph roles</text>
  <text class="sub" x="400" y="285" style="fill:#c5d0dc">Least privilege grants</text>

  <path class="wire-accent" d="M640 220 H700"/>
  <polygon points="700,212 712,220 700,228" class="dot"/>

  <rect class="panel" x="720" y="150" width="200" height="180" rx="3"/>
  <text class="tiny" x="740" y="180">RESOURCE</text>
  <text class="label" x="740" y="210">Microsoft Graph</text>
  <text class="sub" x="740" y="240">or Key Vault</text>
  <text class="sub" x="740" y="265">or custom API</text>
</svg>
