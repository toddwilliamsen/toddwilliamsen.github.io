<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title">
  <title id="title">Look n Cook core loop from capture to cook mode</title>
  
<style>
  .bg { fill: #f0f3f7; }
  .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
  .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
  .panel-ink { fill: #101820; }
  .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 22px; font-weight: 700; fill: #101820; }
  .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #101820; }
  .label-inv { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #f7f9fb; }
  .sub { font-family: Source Serif 4, Georgia, serif; font-size: 12px; fill: #3d4a5c; }
  .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 11px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
  .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.8; }
</style>

  <rect class="bg" width="960" height="380"/>
  
  <text class="title" x="40" y="48">Look n Cook — Core Loop</text>
  <text class="sub" x="40" y="72">Capture → detect → confirm → match → cook — on your phone</text>

  <rect class="panel" x="40" y="120" width="150" height="90" rx="3"/>
  <text class="tiny" x="58" y="150">1 · CAPTURE</text>
  <text class="label" x="58" y="180">Photos / type</text>

  <rect class="panel-accent" x="210" y="120" width="150" height="90" rx="3"/>
  <text class="tiny" x="228" y="150">2 · DETECT</text>
  <text class="label" x="228" y="180">ClearSight AI</text>

  <rect class="panel" x="380" y="120" width="150" height="90" rx="3"/>
  <text class="tiny" x="398" y="150">3 · CONFIRM</text>
  <text class="label" x="398" y="180">Edit list</text>

  <rect class="panel" x="550" y="120" width="150" height="90" rx="3"/>
  <text class="tiny" x="568" y="150">4 · MATCH</text>
  <text class="label" x="568" y="180">~13.5k recipes</text>

  <rect class="panel-ink" x="720" y="120" width="200" height="90" rx="3"/>
  <text class="tiny" x="738" y="150" style="fill:#c5d0dc">5 · COOK</text>
  <text class="label-inv" x="738" y="180">Steps · shop · save</text>

  <path class="wire-accent" d="M190 165 H210"/>
  <path class="wire-accent" d="M360 165 H380"/>
  <path class="wire-accent" d="M530 165 H550"/>
  <path class="wire-accent" d="M700 165 H720"/>

  <rect class="panel" x="40" y="250" width="880" height="100" rx="3"/>
  <text class="tiny" x="70" y="285">ON-DEVICE BY DEFAULT</text>
  <text class="sub" x="70" y="315">Vision, recipe matching, and storage stay on the iPhone — kitchen photos are not the product’s cloud training set.</text>
  <text class="sub" x="70" y="340">Expo / React Native · Zustand · SQLite · optional RevenueCat when freemium ships</text>

</svg>
