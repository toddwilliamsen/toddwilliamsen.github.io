<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title">
  <title id="title">GitHub Actions OIDC to App Service</title>
  <style>
    .bg { fill: #f0f3f7; }
    .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
    .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
    .panel-ink { fill: #101820; }
    .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 20px; font-weight: 700; fill: #101820; }
    .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #101820; }
    .label-inv { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 12px; font-weight: 700; fill: #f7f9fb; }
    .sub { font-family: Source Serif 4, Georgia, serif; font-size: 12px; fill: #3d4a5c; }
    .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 11px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
    .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.8; stroke-dasharray: 7 11; }
    .dot { fill: #9a4e1a; }
  </style>
  <rect class="bg" width="960" height="460"/>
  <text class="title" x="40" y="40">GitHub Actions + OIDC Deploy</text>
  <text class="sub" x="40" y="64">Federated credential - no AZURE_CLIENT_SECRET in GitHub</text>

  <rect class="panel" x="40" y="140" width="200" height="160" rx="3"/>
  <text class="tiny" x="58" y="170">GITHUB</text>
  <text class="label" x="58" y="200">Actions job</text>
  <text class="sub" x="58" y="230">OIDC token</text>
  <text class="sub" x="58" y="255">repo + env claims</text>

  <path class="wire-accent" d="M240 220 H290"/>
  <polygon points="290,212 302,220 290,228" class="dot"/>

  <rect class="panel-ink" x="310" y="120" width="280" height="200" rx="3"/>
  <text class="tiny" x="330" y="150" style="fill:#c5d0dc">ENTRA APP</text>
  <text class="label-inv" x="330" y="185">Federated credential</text>
  <text class="sub" x="330" y="220" style="fill:#c5d0dc">Issuer: token.actions...</text>
  <text class="sub" x="330" y="245" style="fill:#c5d0dc">Subject: repo:org/name</text>
  <text class="sub" x="330" y="285" style="fill:#c5d0dc">No client secret</text>

  <path class="wire-accent" d="M590 220 H640"/>
  <polygon points="640,212 652,220 640,228" class="dot"/>

  <rect class="panel-accent" x="660" y="140" width="260" height="160" rx="3"/>
  <text class="tiny" x="680" y="170">AZURE</text>
  <text class="label" x="680" y="200">App Service</text>
  <text class="sub" x="680" y="230">RBAC: Website Contributor</text>
  <text class="sub" x="680" y="255">az webapp deploy</text>
</svg>
