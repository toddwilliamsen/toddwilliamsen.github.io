<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title">
  <title id="title">Storage private endpoint path</title>
  <style>
    .bg { fill: #f0f3f7; }
    .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
    .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
    .panel-ink { fill: #101820; }
    .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 22px; font-weight: 700; fill: #101820; }
    .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #101820; }
    .sub { font-family: Source Serif 4, Georgia, serif; font-size: 12px; fill: #3d4a5c; }
    .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 11px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
    .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.8; stroke-dasharray: 7 11; }
    .dot { fill: #9a4e1a; }
    .on-ink { fill: #c5d0dc; }
    .on-ink-label { fill: #f0f3f7; }
  </style>

  <rect class="bg" width="960" height="520"/>
  <text class="title" x="40" y="44">Private Endpoint for Storage</text>
  <text class="sub" x="40" y="68">VM DNS to privatelink zone to PE NIC to blob data plane</text>

  <rect class="panel" x="40" y="150" width="180" height="120" rx="3"/>
  <text class="tiny" x="58" y="180">VM</text>
  <text class="label" x="58" y="210">Workload NIC</text>
  <text class="sub" x="58" y="234">nslookup blob FQDN</text>

  <path class="wire-accent" d="M220 210 H280"/>
  <polygon points="280,202 292,210 280,218" class="dot"/>

  <rect class="panel-accent" x="290" y="140" width="220" height="140" rx="3"/>
  <text class="tiny" x="308" y="170">PRIVATE DNS</text>
  <text class="label" x="308" y="200">privatelink.blob</text>
  <text class="sub" x="308" y="224">.core.windows.net</text>
  <text class="sub" x="308" y="246">Linked to VNet</text>

  <path class="wire-accent" d="M510 210 H570"/>
  <polygon points="570,202 582,210 570,218" class="dot"/>

  <rect class="panel-ink" x="590" y="100" width="330" height="360" rx="3"/>
  <text class="tiny on-ink" x="610" y="130">VNET</text>

  <rect class="panel-accent" x="620" y="160" width="270" height="120" rx="3"/>
  <text class="tiny" x="638" y="190">PE SUBNET</text>
  <text class="label" x="638" y="220">Private endpoint NIC</text>
  <text class="sub" x="638" y="244">Private IP for blob</text>

  <rect class="panel" x="620" y="310" width="270" height="120" rx="3"/>
  <text class="tiny" x="638" y="340">STORAGE</text>
  <text class="label" x="638" y="370">Public access off</text>
  <text class="sub" x="638" y="394">After PE proven</text>
</svg>
