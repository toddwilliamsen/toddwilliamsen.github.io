<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title">
  <title id="title">Azure App Service web app from scratch</title>
  <style>
    .bg { fill: #f0f3f7; }
    .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
    .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
    .panel-ink { fill: #101820; }
    .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 20px; font-weight: 700; fill: #101820; }
    .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #101820; }
    .label-inv { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #f7f9fb; }
    .sub { font-family: Source Serif 4, Georgia, serif; font-size: 12px; fill: #3d4a5c; }
    .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 11px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
    .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.8; stroke-dasharray: 7 11; }
    .dot { fill: #9a4e1a; }
  </style>
  <rect class="bg" width="960" height="460"/>
  <text class="title" x="40" y="40">App Service Web App - First Deploy</text>
  <text class="sub" x="40" y="64">Resource group to App Service plan to Web App to HTTPS URL</text>

  <rect class="panel" x="40" y="110" width="180" height="120" rx="3"/>
  <text class="tiny" x="58" y="140">CODE</text>
  <text class="label" x="58" y="170">ZIP / Git</text>
  <text class="sub" x="58" y="198">Local sample</text>

  <path class="wire-accent" d="M220 170 H270"/>
  <polygon points="270,162 282,170 270,178" class="dot"/>

  <rect class="panel-ink" x="290" y="90" width="400" height="300" rx="3"/>
  <text class="tiny" x="310" y="120" style="fill:#c5d0dc">AZURE RESOURCE GROUP</text>

  <rect class="panel-accent" x="320" y="145" width="340" height="90" rx="3"/>
  <text class="tiny" x="340" y="175">COMPUTE</text>
  <text class="label" x="340" y="205">App Service plan</text>
  <text class="sub" x="340" y="228">SKU B1 / Free F1 lab</text>

  <rect class="panel" x="320" y="260" width="340" height="100" rx="3"/>
  <text class="tiny" x="340" y="290">SITE</text>
  <text class="label" x="340" y="320">Web App</text>
  <text class="sub" x="340" y="345">Runtime stack + HTTPS</text>

  <path class="wire-accent" d="M690 310 H740"/>
  <polygon points="740,302 752,310 740,318" class="dot"/>

  <rect class="panel-accent" x="760" y="250" width="160" height="120" rx="3"/>
  <text class="tiny" x="780" y="280">USERS</text>
  <text class="label" x="780" y="310">Browser</text>
  <text class="sub" x="780" y="338">*.azurewebsites.net</text>
</svg>
