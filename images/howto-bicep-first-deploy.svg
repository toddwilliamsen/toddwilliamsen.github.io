<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title">
  <title id="title">First Bicep deploy flow</title>
  <style>
    .bg { fill: #f0f3f7; }
    .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
    .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
    .panel-ink { fill: #101820; }
    .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 22px; font-weight: 700; fill: #101820; }
    .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #101820; }
    .sub { font-family: Source Serif 4, Georgia, serif; font-size: 12px; fill: #3d4a5c; }
    .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 11px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
    .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.8; stroke-dasharray: 7 11; }
    .dot { fill: #9a4e1a; }
  </style>

  <rect class="bg" width="960" height="520"/>
  <text class="title" x="40" y="44">First Bicep Deploy</text>
  <text class="sub" x="40" y="68">main.bicep - what-if - az deployment group create - Azure resources</text>

  <rect class="panel" x="40" y="150" width="200" height="140" rx="3"/>
  <text class="tiny" x="58" y="180">AUTHOR</text>
  <text class="label" x="58" y="210">main.bicep</text>
  <text class="sub" x="58" y="234">params + resources</text>
  <text class="sub" x="58" y="256">Secure defaults</text>

  <path class="wire-accent" d="M240 220 H300"/>
  <polygon points="300,212 312,220 300,228" class="dot"/>

  <rect class="panel-accent" x="320" y="150" width="200" height="140" rx="3"/>
  <text class="tiny" x="338" y="180">PREFLIGHT</text>
  <text class="label" x="338" y="210">what-if</text>
  <text class="sub" x="338" y="234">Create / Modify</text>
  <text class="sub" x="338" y="256">Review before apply</text>

  <path class="wire-accent" d="M520 220 H580"/>
  <polygon points="580,212 592,220 580,228" class="dot"/>

  <rect class="panel" x="600" y="150" width="200" height="140" rx="3"/>
  <text class="tiny" x="618" y="180">DEPLOY</text>
  <text class="label" x="618" y="210">az deployment</text>
  <text class="sub" x="618" y="234">group create</text>
  <text class="sub" x="618" y="256">Same as CI later</text>

  <path class="wire-accent" d="M700 290 V330"/>
  <polygon points="692,330 700,342 708,330" class="dot"/>

  <rect class="panel-ink" x="40" y="350" width="880" height="120" rx="3"/>
  <text class="tiny" x="60" y="385" style="fill:#c5d0dc">AZURE</text>
  <text class="label" x="60" y="420" style="fill:#f0f3f7">Resource group + storage (TLS1_2, no public blob access)</text>
  <text class="sub" x="60" y="448" style="fill:#c5d0dc">Redeploy converges - delete RG when the lab is done</text>
</svg>
