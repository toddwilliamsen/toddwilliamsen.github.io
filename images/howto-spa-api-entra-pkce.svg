<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title">
  <title id="title">SPA plus API with PKCE</title>
  <style>
    .bg { fill: #f0f3f7; }
    .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
    .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
    .panel-ink { fill: #101820; }
    .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 20px; font-weight: 700; fill: #101820; }
    .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #101820; }
    .label-inv { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 12px; font-weight: 700; fill: #f7f9fb; }
    .sub { font-family: Source Serif 4, Georgia, serif; font-size: 12px; fill: #3d4a5c; }
    .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 11px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
    .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.8; stroke-dasharray: 7 11; }
    .dot { fill: #9a4e1a; }
  </style>
  <rect class="bg" width="960" height="480"/>
  <text class="title" x="40" y="40">SPA + API with Entra PKCE</text>
  <text class="sub" x="40" y="64">Public SPA client - auth code + PKCE - access token for API audience</text>

  <rect class="panel" x="40" y="120" width="180" height="140" rx="3"/>
  <text class="tiny" x="58" y="150">SPA</text>
  <text class="label" x="58" y="180">MSAL.js</text>
  <text class="sub" x="58" y="210">Public client</text>
  <text class="sub" x="58" y="235">No secret</text>

  <path class="wire-accent" d="M220 180 H270"/>
  <polygon points="270,172 282,180 270,188" class="dot"/>

  <rect class="panel-ink" x="290" y="100" width="280" height="180" rx="3"/>
  <text class="tiny" x="310" y="130" style="fill:#c5d0dc">ENTRA</text>
  <text class="label-inv" x="310" y="165">Auth code + PKCE</text>
  <text class="sub" x="310" y="200" style="fill:#c5d0dc">SPA redirect URI</text>
  <text class="sub" x="310" y="225" style="fill:#c5d0dc">Scope: api://.../access</text>

  <path class="wire-accent" d="M430 280 V320"/>
  <polygon points="422,320 430,332 438,320" class="dot"/>

  <rect class="panel-accent" x="290" y="340" width="280" height="100" rx="3"/>
  <text class="tiny" x="310" y="370">API APP REG</text>
  <text class="label" x="310" y="400">Audience + scopes</text>

  <path class="wire-accent" d="M570 390 H640"/>
  <polygon points="640,382 652,390 640,398" class="dot"/>

  <rect class="panel" x="660" y="340" width="260" height="100" rx="3"/>
  <text class="tiny" x="680" y="370">API HOST</text>
  <text class="label" x="680" y="400">Validate JWT</text>
</svg>
