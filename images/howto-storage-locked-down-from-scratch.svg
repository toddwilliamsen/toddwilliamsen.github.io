<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title">
  <title id="title">Locked down Azure Storage</title>
  <style>
    .bg { fill: #f0f3f7; }
    .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
    .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
    .panel-ink { fill: #101820; }
    .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 22px; font-weight: 700; fill: #101820; }
    .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #101820; }
    .sub { font-family: Source Serif 4, Georgia, serif; font-size: 12px; fill: #3d4a5c; }
    .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 11px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
    .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.8; stroke-dasharray: 7 11; }
    .dot { fill: #9a4e1a; }
    .on-ink { fill: #c5d0dc; }
    .on-ink-label { fill: #f0f3f7; }
  </style>

  <rect class="bg" width="960" height="520"/>
  <text class="title" x="40" y="44">Storage Lockdown Baseline</text>
  <text class="sub" x="40" y="68">No anonymous public access - RBAC data plane - TLS - network rules</text>

  <rect class="panel" x="40" y="120" width="200" height="120" rx="3"/>
  <text class="tiny" x="58" y="150">IDENTITY</text>
  <text class="label" x="58" y="180">Entra user / MI</text>
  <text class="sub" x="58" y="202">Blob Data RBAC</text>

  <path class="wire-accent" d="M240 180 H300"/>
  <polygon points="300,172 312,180 300,188" class="dot"/>

  <rect class="panel-ink" x="320" y="100" width="600" height="360" rx="3"/>
  <text class="tiny on-ink" x="340" y="130">STORAGE ACCOUNT</text>
  <text class="label on-ink-label" x="340" y="158">stlab* - HTTPS / TLS1_2</text>

  <rect class="panel-accent" x="350" y="180" width="520" height="90" rx="3"/>
  <text class="tiny" x="368" y="210">PUBLIC BLOB ACCESS</text>
  <text class="label" x="368" y="240">Disabled at account</text>

  <rect class="panel" x="350" y="290" width="240" height="130" rx="3"/>
  <text class="tiny" x="368" y="320">CONTAINER</text>
  <text class="label" x="368" y="350">app-data</text>
  <text class="sub" x="368" y="374">Private - no anon</text>
  <text class="sub" x="368" y="396">Soft delete on</text>

  <rect class="panel-accent" x="620" y="290" width="250" height="130" rx="3"/>
  <text class="tiny" x="638" y="320">NETWORK</text>
  <text class="label" x="638" y="350">Firewall / PE ready</text>
  <text class="sub" x="638" y="374">Default Deny when set</text>
  <text class="sub" x="638" y="396">Prefer private endpoint</text>
</svg>
