<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title">
  <title id="title">Management groups and policy</title>
  <style>
    .bg { fill: #f0f3f7; }
    .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
    .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
    .panel-ink { fill: #101820; }
    .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 22px; font-weight: 700; fill: #101820; }
    .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #101820; }
    .sub { font-family: Source Serif 4, Georgia, serif; font-size: 12px; fill: #3d4a5c; }
    .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 11px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
    .on-ink { fill: #c5d0dc; }
    .on-ink-label { fill: #f0f3f7; }
  </style>

  <rect class="bg" width="960" height="520"/>
  <text class="title" x="40" y="44">Landing Zone Starter - MGs</text>
  <text class="sub" x="40" y="68">Hierarchy - nest subscriptions - assign Audit policy at MG</text>

  <rect class="panel-ink" x="40" y="100" width="880" height="70" rx="3"/>
  <text class="label on-ink-label" x="60" y="142">Tenant Root / mg-contoso-root</text>

  <rect class="panel" x="40" y="200" width="400" height="100" rx="3"/>
  <text class="tiny" x="58" y="230">PLATFORM</text>
  <text class="label" x="58" y="260">mg-platform</text>
  <text class="sub" x="58" y="282">Shared services subs</text>

  <rect class="panel-accent" x="480" y="200" width="440" height="100" rx="3"/>
  <text class="tiny" x="498" y="230">LANDING ZONES</text>
  <text class="label" x="498" y="260">mg-landing-zones</text>
  <text class="sub" x="498" y="282">Policy assigned here or below</text>

  <rect class="panel" x="480" y="330" width="200" height="110" rx="3"/>
  <text class="tiny" x="498" y="360">CORP</text>
  <text class="label" x="498" y="390">mg-corp</text>
  <text class="sub" x="498" y="412">Prod subscriptions</text>

  <rect class="panel" x="720" y="330" width="200" height="110" rx="3"/>
  <text class="tiny" x="738" y="360">SANDBOX</text>
  <text class="label" x="738" y="390">mg-sandboxes</text>
  <text class="sub" x="738" y="412">Start policy here</text>

  <rect class="panel-accent" x="40" y="330" width="400" height="110" rx="3"/>
  <text class="tiny" x="58" y="360">INHERITANCE</text>
  <text class="label" x="58" y="390">MG policy flows to child subs</text>
  <text class="sub" x="58" y="412">Audit first - Deny later</text>
</svg>
