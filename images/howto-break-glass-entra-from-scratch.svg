<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title">
  <title id="title">Entra break-glass accounts</title>
  <style>
    .bg { fill: #f0f3f7; }
    .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
    .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
    .panel-ink { fill: #101820; }
    .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 22px; font-weight: 700; fill: #101820; }
    .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #101820; }
    .sub { font-family: Source Serif 4, Georgia, serif; font-size: 12px; fill: #3d4a5c; }
    .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 11px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
    .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.8; stroke-dasharray: 7 11; }
    .dot { fill: #9a4e1a; }
    .on-ink { fill: #c5d0dc; }
    .on-ink-label { fill: #f0f3f7; }
  </style>

  <rect class="bg" width="960" height="520"/>
  <text class="title" x="40" y="44">Entra Break-Glass</text>
  <text class="sub" x="40" y="68">Two cloud-only emergency admins - excluded from CA - monitored</text>

  <rect class="panel-ink" x="40" y="100" width="880" height="380" rx="3"/>
  <text class="tiny on-ink" x="60" y="130">ENTRA TENANT</text>

  <rect class="panel-accent" x="60" y="160" width="280" height="140" rx="3"/>
  <text class="tiny" x="78" y="190">EMERGENCY 01</text>
  <text class="label" x="78" y="220">breakglass01@</text>
  <text class="sub" x="78" y="244">*.onmicrosoft.com</text>
  <text class="sub" x="78" y="266">Global Administrator</text>

  <rect class="panel-accent" x="360" y="160" width="280" height="140" rx="3"/>
  <text class="tiny" x="378" y="190">EMERGENCY 02</text>
  <text class="label" x="378" y="220">breakglass02@</text>
  <text class="sub" x="378" y="244">*.onmicrosoft.com</text>
  <text class="sub" x="378" y="266">Global Administrator</text>

  <rect class="panel" x="660" y="160" width="230" height="140" rx="3"/>
  <text class="tiny" x="678" y="190">GROUP</text>
  <text class="label" x="678" y="220">sg-break-glass</text>
  <text class="sub" x="678" y="244">CA exclude target</text>
  <text class="sub" x="678" y="266">Two members only</text>

  <path class="wire-accent" d="M480 300 V330"/>
  <polygon points="472,330 480,342 488,330" class="dot"/>

  <rect class="panel" x="60" y="340" width="400" height="110" rx="3"/>
  <text class="tiny" x="78" y="370">CONDITIONAL ACCESS</text>
  <text class="label" x="78" y="400">Exclude emergency group</text>
  <text class="sub" x="78" y="424">Do not strand all admins</text>

  <rect class="panel-accent" x="500" y="340" width="390" height="110" rx="3"/>
  <text class="tiny" x="518" y="370">MONITORING</text>
  <text class="label" x="518" y="400">Any sign-in = investigate</text>
  <text class="sub" x="518" y="424">Alert + quarterly retrieval test</text>
</svg>
