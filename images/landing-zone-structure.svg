<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title">
  <title id="title">Azure Landing Zone control plane overview</title>
  
<style>
  .bg { fill: #f0f3f7; }
  .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
  .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
  .panel-ink { fill: #101820; }
  .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 22px; font-weight: 700; fill: #101820; }
  .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #101820; letter-spacing: 0.02em; }
  .label-inv { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #f7f9fb; }
  .sub { font-family: Source Serif 4, Georgia, serif; font-size: 12px; fill: #3d4a5c; }
  .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 11px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
  .wire { fill: none; stroke: #101820; stroke-width: 1.4; stroke-opacity: 0.35; }
  .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.8; }
  .dot { fill: #9a4e1a; }

  .wire-accent, .flow {
    stroke-dasharray: 7 11;
    animation: viz-flow 2.8s linear infinite;
  }
  .wire {
    stroke-dasharray: 3 9;
    animation: viz-flow 9s linear infinite;
  }
  .panel-accent, .dot, .node-pulse {
    animation: viz-pulse 3.2s ease-in-out infinite;
  }
  @keyframes viz-flow {
    to { stroke-dashoffset: -72; }
  }
  @keyframes viz-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  @media (prefers-reduced-motion: reduce) {
    .wire-accent, .flow, .wire, .panel-accent, .dot, .node-pulse { animation: none; }
  }

</style>

  <rect class="bg" width="960" height="560"/>
  
  <text class="title" x="40" y="48">Azure Landing Zone — Control Plane</text>
  <text class="sub" x="40" y="72">Security controls inherited from the top down, validated continuously</text>

  <rect class="panel-ink" x="40" y="100" width="880" height="56" rx="3"/>
  <text class="label-inv" x="60" y="134">Microsoft Entra ID  ·  Identity &amp; Privileged Access Control Plane</text>

  <rect class="panel-accent" x="40" y="176" width="880" height="70" rx="3"/>
  <text class="tiny" x="60" y="200">MANAGEMENT GROUP HIERARCHY</text>
  <text class="label" x="60" y="226">Platform  →  Landing Zones  →  Sandbox  →  Decommissioned</text>

  <rect class="panel" x="40" y="270" width="280" height="150" rx="3"/>
  <text class="tiny" x="60" y="298">IDENTITY</text>
  <text class="label" x="60" y="326">PIM / JIT admin</text>
  <text class="sub" x="60" y="350">Workload identities</text>
  <text class="sub" x="60" y="372">Conditional Access</text>
  <text class="sub" x="60" y="394">Break-glass accounts</text>

  <rect class="panel" x="340" y="270" width="280" height="150" rx="3"/>
  <text class="tiny" x="360" y="298">NETWORK</text>
  <text class="label" x="360" y="326">Hub / spoke or vWAN</text>
  <text class="sub" x="360" y="350">Private endpoints</text>
  <text class="sub" x="360" y="372">DNS + routing</text>
  <text class="sub" x="360" y="394">Egress control</text>

  <rect class="panel" x="640" y="270" width="280" height="150" rx="3"/>
  <text class="tiny" x="660" y="298">GOVERNANCE</text>
  <text class="label" x="660" y="326">Azure Policy</text>
  <text class="sub" x="660" y="350">Subscription vending</text>
  <text class="sub" x="660" y="372">Tags &amp; ownership</text>
  <text class="sub" x="660" y="394">Deny / audit / deploy</text>

  <path class="wire-accent" d="M180 420 V450 H480 V470"><animate attributeName="stroke-dashoffset" values="0;-72" dur="2.8s" repeatCount="indefinite"/></path>
  <path class="wire-accent" d="M480 420 V470"><animate attributeName="stroke-dashoffset" values="0;-72" dur="2.8s" repeatCount="indefinite"/></path>
  <path class="wire-accent" d="M780 420 V450 H480 V470"><animate attributeName="stroke-dashoffset" values="0;-72" dur="2.8s" repeatCount="indefinite"/></path>

  <rect class="panel-accent" x="200" y="470" width="560" height="60" rx="3"/>
  <text class="label" x="230" y="506">Security Operations  ·  Defender + Sentinel + SOAR playbooks</text>

</svg>
