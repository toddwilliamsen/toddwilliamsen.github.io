<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title">
  <title id="title">Workload identity for Container Apps</title>
  <style>
    .bg { fill: #f0f3f7; }
    .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
    .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
    .panel-ink { fill: #101820; }
    .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 18px; font-weight: 700; fill: #101820; }
    .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 12px; font-weight: 700; fill: #101820; }
    .label-inv { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 12px; font-weight: 700; fill: #f7f9fb; }
    .sub { font-family: Source Serif 4, Georgia, serif; font-size: 11px; fill: #3d4a5c; }
    .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 10px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
    .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.8; stroke-dasharray: 7 11; }
    .dot { fill: #9a4e1a; }
  </style>
  <rect class="bg" width="960" height="460"/>
  <text class="title" x="40" y="40">Workload Identity - Azure Container Apps</text>
  <text class="sub" x="40" y="64">User-assigned MI + federated identity - pods get tokens without secrets</text>

  <rect class="panel-accent" x="40" y="120" width="280" height="260" rx="3"/>
  <text class="tiny" x="60" y="150">CONTAINER APPS</text>
  <text class="label" x="60" y="185">Environment + App</text>
  <text class="sub" x="60" y="220">Workload identity on</text>
  <text class="sub" x="60" y="245">UAMI bound to app</text>
  <text class="sub" x="60" y="285">No kube secret for Azure</text>

  <path class="wire-accent" d="M320 240 H380"/>
  <polygon points="380,232 392,240 380,248" class="dot"/>

  <rect class="panel-ink" x="400" y="120" width="260" height="260" rx="3"/>
  <text class="tiny" x="420" y="150" style="fill:#c5d0dc">ENTRA</text>
  <text class="label-inv" x="420" y="185">Federated credential</text>
  <text class="sub" x="420" y="220" style="fill:#c5d0dc">On the UAMI</text>
  <text class="sub" x="420" y="245" style="fill:#c5d0dc">Issuer + subject</text>
  <text class="sub" x="420" y="285" style="fill:#c5d0dc">Short-lived tokens</text>

  <path class="wire-accent" d="M660 240 H720"/>
  <polygon points="720,232 732,240 720,248" class="dot"/>

  <rect class="panel" x="740" y="160" width="180" height="180" rx="3"/>
  <text class="tiny" x="760" y="190">RESOURCE</text>
  <text class="label" x="760" y="225">Key Vault</text>
  <text class="sub" x="760" y="255">Storage / SQL</text>
  <text class="sub" x="760" y="280">RBAC to UAMI</text>
</svg>
