<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title">
  <title id="title">Azure Key Vault baseline</title>
  <style>
    .bg { fill: #f0f3f7; }
    .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
    .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
    .panel-ink { fill: #101820; }
    .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 22px; font-weight: 700; fill: #101820; }
    .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #101820; }
    .sub { font-family: Source Serif 4, Georgia, serif; font-size: 12px; fill: #3d4a5c; }
    .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 11px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
    .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.8; stroke-dasharray: 7 11; }
    .dot { fill: #9a4e1a; }
    .on-ink { fill: #c5d0dc; }
    .on-ink-label { fill: #f0f3f7; }
  </style>

  <rect class="bg" width="960" height="520"/>
  <text class="title" x="40" y="44">Key Vault from Scratch</text>
  <text class="sub" x="40" y="68">RBAC auth - soft delete - purge protection - secrets by identity</text>

  <rect class="panel" x="40" y="130" width="200" height="120" rx="3"/>
  <text class="tiny" x="58" y="160">ADMIN</text>
  <text class="label" x="58" y="190">Entra user</text>
  <text class="sub" x="58" y="212">Secrets Officer</text>

  <path class="wire-accent" d="M240 190 H300"/>
  <polygon points="300,182 312,190 300,198" class="dot"/>

  <rect class="panel-ink" x="320" y="100" width="600" height="360" rx="3"/>
  <text class="tiny on-ink" x="340" y="130">KEY VAULT</text>
  <text class="label on-ink-label" x="340" y="158">kv-lab-* - RBAC mode</text>

  <rect class="panel-accent" x="350" y="190" width="250" height="110" rx="3"/>
  <text class="tiny" x="368" y="220">PROTECTION</text>
  <text class="label" x="368" y="250">Soft delete + purge</text>
  <text class="sub" x="368" y="274">Retention window on</text>

  <rect class="panel" x="630" y="190" width="250" height="110" rx="3"/>
  <text class="tiny" x="648" y="220">SECRET</text>
  <text class="label" x="648" y="250">DbConnectionString</text>
  <text class="sub" x="648" y="274">Versioned value</text>

  <rect class="panel-accent" x="350" y="330" width="530" height="100" rx="3"/>
  <text class="tiny" x="368" y="360">DIAGNOSTICS</text>
  <text class="label" x="368" y="390">AuditEvent to Log Analytics</text>
  <text class="sub" x="368" y="412">Know who read secrets</text>
</svg>
