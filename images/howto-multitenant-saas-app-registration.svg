<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title">
  <title id="title">Multi-tenant SaaS app registration</title>
  <style>
    .bg { fill: #f0f3f7; }
    .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
    .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
    .panel-ink { fill: #101820; }
    .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 18px; font-weight: 700; fill: #101820; }
    .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 12px; font-weight: 700; fill: #101820; }
    .label-inv { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 12px; font-weight: 700; fill: #f7f9fb; }
    .sub { font-family: Source Serif 4, Georgia, serif; font-size: 11px; fill: #3d4a5c; }
    .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 10px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
    .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.8; stroke-dasharray: 7 11; }
    .dot { fill: #9a4e1a; }
  </style>
  <rect class="bg" width="960" height="480"/>
  <text class="title" x="40" y="40">Multi-Tenant SaaS App Registration Design</text>
  <text class="sub" x="40" y="64">One publisher app - consent in each customer tenant - validate issuer carefully</text>

  <rect class="panel-ink" x="40" y="110" width="300" height="300" rx="3"/>
  <text class="tiny" x="60" y="140" style="fill:#c5d0dc">PUBLISHER TENANT</text>
  <text class="label-inv" x="60" y="175">Multi-tenant app</text>
  <text class="sub" x="60" y="210" style="fill:#c5d0dc">Accounts in any org</text>
  <text class="sub" x="60" y="235" style="fill:#c5d0dc">Publisher verification</text>
  <text class="sub" x="60" y="275" style="fill:#c5d0dc">Least privilege scopes</text>
  <text class="sub" x="60" y="300" style="fill:#c5d0dc">Admin consent flow</text>

  <path class="wire-accent" d="M340 260 H400"/>
  <polygon points="400,252 412,260 400,268" class="dot"/>

  <rect class="panel-accent" x="420" y="120" width="240" height="130" rx="3"/>
  <text class="tiny" x="440" y="150">TENANT A</text>
  <text class="label" x="440" y="180">Service principal</text>
  <text class="sub" x="440" y="210">Consent recorded</text>

  <rect class="panel" x="420" y="280" width="240" height="130" rx="3"/>
  <text class="tiny" x="440" y="310">TENANT B</text>
  <text class="label" x="440" y="340">Service principal</text>
  <text class="sub" x="440" y="370">Separate consent</text>

  <path class="wire-accent" d="M660 260 H720"/>
  <polygon points="720,252 732,260 720,268" class="dot"/>

  <rect class="panel" x="740" y="180" width="180" height="160" rx="3"/>
  <text class="tiny" x="760" y="210">YOUR API</text>
  <text class="label" x="760" y="245">Validate tid</text>
  <text class="sub" x="760" y="275">Allowlist tenants</text>
  <text class="sub" x="760" y="300">iss per tenant</text>
</svg>
