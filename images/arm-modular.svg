<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title">
  <title id="title">Modular ARM composition</title>
  
<style>
  .bg { fill: #f0f3f7; }
  .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
  .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
  .panel-ink { fill: #101820; }
  .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 22px; font-weight: 700; fill: #101820; }
  .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #101820; }
  .label-inv { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #f7f9fb; }
  .sub { font-family: Source Serif 4, Georgia, serif; font-size: 12px; fill: #3d4a5c; }
  .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 11px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
  .wire { fill: none; stroke: #101820; stroke-width: 1.4; stroke-opacity: 0.35; }
  .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.8; }
</style>

  <rect class="bg" width="960" height="500"/>
  
  <text class="title" x="40" y="48">Modular ARM Composition</text>
  <text class="sub" x="40" y="72">Parameters in · modules compose · outputs chain</text>

  <rect class="panel-ink" x="40" y="120" width="220" height="100" rx="3"/>
  <text class="label-inv" x="70" y="165">parameters.json</text>
  <text class="sub" x="70" y="195" style="fill:#c5d0dc">env · region · tags</text>

  <path class="wire-accent" d="M260 170 H310"/>

  <rect class="panel-accent" x="310" y="100" width="280" height="140" rx="3"/>
  <text class="tiny" x="335" y="130">MAIN TEMPLATE</text>
  <text class="label" x="335" y="165">orchestrates modules</text>
  <text class="sub" x="335" y="195">networking · identity · compute</text>
  <text class="sub" x="335" y="220">passes params / consumes outputs</text>

  <path class="wire-accent" d="M590 170 H640"/>

  <rect class="panel" x="640" y="90" width="280" height="70" rx="3"/>
  <text class="label" x="665" y="132">linked: network.json</text>

  <rect class="panel" x="640" y="175" width="280" height="70" rx="3"/>
  <text class="label" x="665" y="217">linked: identity.json</text>

  <rect class="panel" x="640" y="260" width="280" height="70" rx="3"/>
  <text class="label" x="665" y="302">linked: workload.json</text>

  <rect class="panel" x="40" y="340" width="880" height="110" rx="3"/>
  <text class="tiny" x="70" y="375">DESIGN RULES</text>
  <text class="sub" x="70" y="408">Keep secrets out of templates · Prefer outputs over hard-coded resource IDs</text>
  <text class="sub" x="70" y="436">dependsOn for order · reference() / list*() for runtime values · one concern per module</text>

</svg>
