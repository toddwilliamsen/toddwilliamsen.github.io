<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title">
  <title id="title">Landing zone network segmentation</title>
  
<style>
  .bg { fill: #f0f3f7; }
  .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
  .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
  .panel-ink { fill: #101820; }
  .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 22px; font-weight: 700; fill: #101820; }
  .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #101820; letter-spacing: 0.02em; }
  .label-inv { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #f7f9fb; }
  .sub { font-family: Source Serif 4, Georgia, serif; font-size: 12px; fill: #3d4a5c; }
  .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 11px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
  .wire { fill: none; stroke: #101820; stroke-width: 1.4; stroke-opacity: 0.35; }
  .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.8; }
  .dot { fill: #9a4e1a; }
</style>

  <rect class="bg" width="960" height="560"/>
  
  <text class="title" x="40" y="48">Network Segmentation</text>
  <text class="sub" x="40" y="72">Blast radius is a design choice, not an incident outcome</text>

  <rect class="panel-ink" x="40" y="110" width="200" height="380" rx="3"/>
  <text class="label-inv" x="60" y="150">HUB</text>
  <text class="sub" x="60" y="180" style="fill:#c5d0dc">Firewall / NVA</text>
  <text class="sub" x="60" y="206" style="fill:#c5d0dc">Shared DNS</text>
  <text class="sub" x="60" y="232" style="fill:#c5d0dc">Bastion</text>
  <text class="sub" x="60" y="258" style="fill:#c5d0dc">VPN / ExpressRoute</text>
  <text class="sub" x="60" y="300" style="fill:#c5d0dc">Central egress</text>
  <text class="sub" x="60" y="326" style="fill:#c5d0dc">IDPS inspection</text>

  <path class="wire-accent" d="M240 220 H300"/>
  <path class="wire-accent" d="M240 300 H300"/>
  <path class="wire-accent" d="M240 400 H300"/>

  <rect class="panel" x="300" y="110" width="300" height="130" rx="3"/>
  <text class="tiny" x="320" y="138">SPOKE · CORP</text>
  <text class="label" x="320" y="168">Internal apps</text>
  <text class="sub" x="320" y="196">Private endpoints preferred</text>
  <text class="sub" x="320" y="218">No direct internet ingress</text>

  <rect class="panel" x="300" y="260" width="300" height="130" rx="3"/>
  <text class="tiny" x="320" y="288">SPOKE · ONLINE</text>
  <text class="label" x="320" y="318">Internet-facing apps</text>
  <text class="sub" x="320" y="346">WAF / Front Door edge</text>
  <text class="sub" x="320" y="368">Isolated from corp spoke</text>

  <rect class="panel" x="300" y="410" width="300" height="80" rx="3"/>
  <text class="tiny" x="320" y="438">SPOKE · SANDBOX</text>
  <text class="label" x="320" y="466">Non-prod / limited trust</text>

  <rect class="panel-accent" x="640" y="110" width="280" height="380" rx="3"/>
  <text class="tiny" x="660" y="145">TRAFFIC RULES</text>
  <text class="label" x="660" y="180">Default deny east-west</text>
  <text class="sub" x="660" y="210">Allow only documented</text>
  <text class="sub" x="660" y="232">application flows</text>
  <text class="label" x="660" y="280">Private DNS zones</text>
  <text class="sub" x="660" y="310">Linked to spokes</text>
  <text class="label" x="660" y="360">Egress via hub only</text>
  <text class="sub" x="660" y="390">Inspect + log + alert</text>
  <text class="label" x="660" y="440">No peering shortcuts</text>
  <text class="sub" x="660" y="470">that bypass inspection</text>

</svg>
