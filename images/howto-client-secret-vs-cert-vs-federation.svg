<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title">
  <title id="title">Client secrets vs certificates vs federation</title>
  <style>
    .bg { fill: #f0f3f7; }
    .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
    .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
    .panel-ink { fill: #101820; }
    .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 18px; font-weight: 700; fill: #101820; }
    .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 12px; font-weight: 700; fill: #101820; }
    .sub { font-family: Source Serif 4, Georgia, serif; font-size: 11px; fill: #3d4a5c; }
    .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 10px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
  </style>
  <rect class="bg" width="960" height="480"/>
  <text class="title" x="40" y="40">Credentials: Secrets vs Certs vs Federated</text>
  <text class="sub" x="40" y="64">Prefer federation or managed identity; secrets are last resort</text>

  <rect class="panel" x="40" y="110" width="280" height="300" rx="3"/>
  <text class="tiny" x="60" y="140">AVOID LONG-LIVED</text>
  <text class="label" x="60" y="175">Client secret</text>
  <text class="sub" x="60" y="205">String in config</text>
  <text class="sub" x="60" y="228">Leaks via git / logs</text>
  <text class="sub" x="60" y="251">Must rotate often</text>
  <text class="sub" x="60" y="290">OK for short lab only</text>

  <rect class="panel-accent" x="340" y="110" width="280" height="300" rx="3"/>
  <text class="tiny" x="360" y="140">BETTER</text>
  <text class="label" x="360" y="175">Certificate</text>
  <text class="sub" x="360" y="205">Private key stays local</text>
  <text class="sub" x="360" y="228">Thumbprint registered</text>
  <text class="sub" x="360" y="251">Still manage lifecycle</text>
  <text class="sub" x="360" y="290">Store key in Key Vault</text>

  <rect class="panel-ink" x="640" y="110" width="280" height="300" rx="3"/>
  <text class="tiny" x="660" y="140" style="fill:#c5d0dc">PREFERRED</text>
  <text class="label" x="660" y="175" style="fill:#f7f9fb">Federated credential</text>
  <text class="sub" x="660" y="205" style="fill:#c5d0dc">GitHub / Azure MI</text>
  <text class="sub" x="660" y="228" style="fill:#c5d0dc">No long-lived secret</text>
  <text class="sub" x="660" y="251" style="fill:#c5d0dc">OIDC trust</text>
  <text class="sub" x="660" y="290" style="fill:#c5d0dc">Least standing privilege</text>
</svg>
