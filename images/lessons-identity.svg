<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title">
  <title id="title">Identity as control plane across Azure M365 and Windows</title>
  
<style>
  .bg { fill: #f0f3f7; }
  .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
  .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
  .panel-ink { fill: #101820; }
  .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 20px; font-weight: 700; fill: #101820; }
  .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 12px; font-weight: 700; fill: #101820; }
  .label-inv { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 12px; font-weight: 700; fill: #f7f9fb; }
  .sub { font-family: Source Serif 4, Georgia, serif; font-size: 11px; fill: #3d4a5c; }
  .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 10px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
  .wire { fill: none; stroke: #101820; stroke-width: 1.3; stroke-opacity: 0.3; }
  .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.7; }

  .wire-accent, .flow {
    stroke-dasharray: 7 11;
    animation: viz-flow 2.8s linear infinite;
  }
  .wire {
    stroke-dasharray: 3 9;
    animation: viz-flow 9s linear infinite;
  }
  .panel-accent, .dot, .node-pulse {
    animation: viz-pulse 3.2s ease-in-out infinite;
  }
  @keyframes viz-flow {
    to { stroke-dashoffset: -72; }
  }
  @keyframes viz-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  @media (prefers-reduced-motion: reduce) {
    .wire-accent, .flow, .wire, .panel-accent, .dot, .node-pulse { animation: none; }
  }

</style>

  <rect class="bg" width="960" height="420"/>
  
  <text class="title" x="40" y="44">Lesson: Identity is the control plane</text>
  <text class="sub" x="40" y="68">Entra ID sits in front of Azure, M365, and hybrid Windows — treat it that way</text>
  <rect class="panel-ink" x="320" y="110" width="320" height="70" rx="3"/>
  <text class="label-inv" x="390" y="152">Microsoft Entra ID</text>
  <path class="wire-accent" d="M480 180 V220"><animate attributeName="stroke-dashoffset" values="0;-72" dur="2.8s" repeatCount="indefinite"/></path>
  <path class="wire" d="M160 220 H800"/>
  <path class="wire" d="M160 220 V250"/><path class="wire" d="M480 220 V250"/><path class="wire" d="M800 220 V250"/>
  <rect class="panel" x="40" y="250" width="240" height="110" rx="3"/>
  <text class="tiny" x="60" y="280">AZURE</text>
  <text class="label" x="60" y="308">RBAC · Managed ID</text>
  <text class="sub" x="60" y="335">Subscriptions / data plane</text>
  <rect class="panel" x="360" y="250" width="240" height="110" rx="3"/>
  <text class="tiny" x="380" y="280">M365</text>
  <text class="label" x="380" y="308">Exchange · SharePoint</text>
  <text class="sub" x="380" y="335">Teams · Purview signals</text>
  <rect class="panel-accent" x="680" y="250" width="240" height="110" rx="3"/>
  <text class="tiny" x="700" y="280">WINDOWS / HYBRID</text>
  <text class="label" x="700" y="308">Hybrid join · Intune</text>
  <text class="sub" x="700" y="335">CA on device posture</text>

</svg>
