<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title">
  <title id="title">Entra app registration basics</title>
  <style>
    .bg { fill: #f0f3f7; }
    .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
    .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
    .panel-ink { fill: #101820; }
    .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 20px; font-weight: 700; fill: #101820; }
    .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #101820; }
    .label-inv { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #f7f9fb; }
    .sub { font-family: Source Serif 4, Georgia, serif; font-size: 12px; fill: #3d4a5c; }
    .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 11px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
    .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.8; stroke-dasharray: 7 11; }
    .dot { fill: #9a4e1a; }
  </style>
  <rect class="bg" width="960" height="480"/>
  <text class="title" x="40" y="40">Entra App Registration - Core Objects</text>
  <text class="sub" x="40" y="64">One registration = Application (client) ID + Object ID + optional credentials</text>

  <rect class="panel-ink" x="40" y="100" width="280" height="320" rx="3"/>
  <text class="tiny" x="60" y="130" style="fill:#c5d0dc">MICROSOFT ENTRA ID</text>
  <text class="label-inv" x="60" y="160">App registration</text>
  <text class="sub" x="60" y="188" style="fill:#c5d0dc">Client ID (app ID)</text>
  <text class="sub" x="60" y="210" style="fill:#c5d0dc">Directory (tenant) ID</text>
  <text class="sub" x="60" y="232" style="fill:#c5d0dc">Object ID</text>
  <text class="sub" x="60" y="268" style="fill:#c5d0dc">Redirect URIs</text>
  <text class="sub" x="60" y="290" style="fill:#c5d0dc">API permissions</text>
  <text class="sub" x="60" y="312" style="fill:#c5d0dc">Certificates / secrets</text>
  <text class="sub" x="60" y="334" style="fill:#c5d0dc">Expose an API (scopes)</text>

  <path class="wire-accent" d="M320 200 H380"/>
  <polygon points="380,192 392,200 380,208" class="dot"/>

  <rect class="panel-accent" x="400" y="120" width="240" height="140" rx="3"/>
  <text class="tiny" x="420" y="150">YOUR APP</text>
  <text class="label" x="420" y="180">Web / SPA / API</text>
  <text class="sub" x="420" y="208">Uses client ID</text>
  <text class="sub" x="420" y="230">Sends users to Entra</text>

  <rect class="panel" x="400" y="290" width="240" height="130" rx="3"/>
  <text class="tiny" x="420" y="320">ENTERPRISE APP</text>
  <text class="label" x="420" y="350">Service principal</text>
  <text class="sub" x="420" y="378">Tenant-local instance</text>

  <path class="wire-accent" d="M640 360 H700"/>
  <polygon points="700,352 712,360 700,368" class="dot"/>

  <rect class="panel" x="720" y="280" width="200" height="140" rx="3"/>
  <text class="tiny" x="740" y="310">ASSIGN</text>
  <text class="label" x="740" y="340">Users / groups</text>
  <text class="sub" x="740" y="368">Roles or claims</text>
</svg>
