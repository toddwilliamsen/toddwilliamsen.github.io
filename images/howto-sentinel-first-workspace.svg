<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title">
  <title id="title">Sentinel first analytic rule</title>
  <style>
    .bg { fill: #f0f3f7; }
    .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
    .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
    .panel-ink { fill: #101820; }
    .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 22px; font-weight: 700; fill: #101820; }
    .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #101820; }
    .sub { font-family: Source Serif 4, Georgia, serif; font-size: 12px; fill: #3d4a5c; }
    .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 11px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
    .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.8; stroke-dasharray: 7 11; }
    .dot { fill: #9a4e1a; }
  </style>

  <rect class="bg" width="960" height="520"/>
  <text class="title" x="40" y="44">Sentinel First Workspace</text>
  <text class="sub" x="40" y="68">Enable on LAW - connector - scheduled rule - incident</text>

  <rect class="panel" x="40" y="140" width="200" height="140" rx="3"/>
  <text class="tiny" x="58" y="170">DATA</text>
  <text class="label" x="58" y="200">Log Analytics</text>
  <text class="sub" x="58" y="224">AzureActivity</text>
  <text class="sub" x="58" y="246">SigninLogs optional</text>

  <path class="wire-accent" d="M240 210 H300"/>
  <polygon points="300,202 312,210 300,218" class="dot"/>

  <rect class="panel-accent" x="320" y="140" width="240" height="140" rx="3"/>
  <text class="tiny" x="338" y="170">SENTINEL</text>
  <text class="label" x="338" y="200">Analytic rule</text>
  <text class="sub" x="338" y="224">Scheduled KQL</text>
  <text class="sub" x="338" y="246">Create incidents</text>

  <path class="wire-accent" d="M560 210 H620"/>
  <polygon points="620,202 632,210 620,218" class="dot"/>

  <rect class="panel-ink" x="640" y="140" width="280" height="140" rx="3"/>
  <text class="tiny" x="658" y="170" style="fill:#c5d0dc">OUTPUT</text>
  <text class="label" x="658" y="200" style="fill:#f0f3f7">Incident queue</text>
  <text class="sub" x="658" y="224" style="fill:#c5d0dc">Triage + assign</text>
  <text class="sub" x="658" y="246" style="fill:#c5d0dc">Tune noise later</text>

  <rect class="panel" x="40" y="330" width="880" height="120" rx="3"/>
  <text class="tiny" x="58" y="360">LAB TIP</text>
  <text class="label" x="58" y="390">Prove one rule end-to-end before enabling dozens from Content hub</text>
  <text class="sub" x="58" y="420">Empty connectors and chatty rules waste money and attention</text>
</svg>
