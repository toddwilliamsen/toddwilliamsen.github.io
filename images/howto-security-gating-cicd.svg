<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title">
  <title id="title">Security gating across CI/CD stages</title>
  <style>
    .bg { fill: #f0f3f7; }
    .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
    .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
    .panel-ink { fill: #101820; }
    .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 20px; font-weight: 700; fill: #101820; }
    .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 12px; font-weight: 700; fill: #101820; }
    .label-inv { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 12px; font-weight: 700; fill: #f7f9fb; }
    .sub { font-family: Source Serif 4, Georgia, serif; font-size: 11px; fill: #3d4a5c; }
    .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 10px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
    .wire { fill: none; stroke: #101820; stroke-width: 1.3; stroke-opacity: 0.3; stroke-dasharray: 3 9; }
    .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.7; stroke-dasharray: 7 11; }
    .dot { fill: #9a4e1a; }
    .wire-accent, .flow {
      animation: viz-flow 2.8s linear infinite;
    }
    .panel-accent, .dot {
      animation: viz-pulse 3.2s ease-in-out infinite;
    }
    @keyframes viz-flow {
      to { stroke-dashoffset: -72; }
    }
    @keyframes viz-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
    @media (prefers-reduced-motion: reduce) {
      .wire-accent, .flow, .panel-accent, .dot { animation: none; }
    }
  </style>

  <rect class="bg" width="960" height="560"/>
  <text class="title" x="40" y="40">Security gating CI/CD</text>
  <text class="sub" x="40" y="64">Four stages of automated checkpoints - fail closed before production</text>

  <!-- Stage 1 -->
  <rect class="panel" x="40" y="110" width="200" height="200" rx="3"/>
  <text class="tiny" x="58" y="140">1 - PRE-MERGE</text>
  <text class="label" x="58" y="168">Source gates</text>
  <text class="sub" x="58" y="196">Branch policies</text>
  <text class="sub" x="58" y="218">Secret scanning</text>
  <text class="sub" x="58" y="240">SAST on PRs</text>
  <text class="sub" x="58" y="268">Block before main</text>

  <path class="wire-accent" d="M240 210 H270"/>
  <polygon points="270,202 282,210 270,218" class="dot"/>

  <!-- Stage 2 -->
  <rect class="panel-accent" x="290" y="110" width="200" height="200" rx="3"/>
  <text class="tiny" x="308" y="140">2 - BUILD / CI</text>
  <text class="label" x="308" y="168">Artifact gates</text>
  <text class="sub" x="308" y="196">SCA / CVEs</text>
  <text class="sub" x="308" y="218">Container + IaC</text>
  <text class="sub" x="308" y="240">MSDO / Trivy</text>
  <text class="sub" x="308" y="268">Sign before push</text>

  <path class="wire-accent" d="M490 210 H520"/>
  <polygon points="520,202 532,210 520,218" class="dot"/>

  <!-- Stage 3 -->
  <rect class="panel" x="540" y="110" width="200" height="200" rx="3"/>
  <text class="tiny" x="558" y="140">3 - RELEASE / CD</text>
  <text class="label" x="558" y="168">Deploy gates</text>
  <text class="sub" x="558" y="196">Policy compliance</text>
  <text class="sub" x="558" y="218">Defender alerts</text>
  <text class="sub" x="558" y="240">REST / Function</text>
  <text class="sub" x="558" y="268">Security approval</text>

  <path class="wire-accent" d="M740 210 H770"/>
  <polygon points="770,202 782,210 770,218" class="dot"/>

  <!-- Stage 4 -->
  <rect class="panel-ink" x="790" y="110" width="130" height="200" rx="3"/>
  <text class="tiny" x="808" y="140" style="fill:#c5d0dc">4 - RUNTIME</text>
  <text class="label-inv" x="808" y="175">Admission</text>
  <text class="sub" x="808" y="210" style="fill:#c5d0dc">AKS / OPA</text>
  <text class="sub" x="808" y="232" style="fill:#c5d0dc">Unsigned</text>
  <text class="sub" x="808" y="254" style="fill:#c5d0dc">blocked</text>

  <!-- Bottom bar -->
  <rect class="panel" x="40" y="360" width="880" height="150" rx="3"/>
  <text class="tiny" x="58" y="395">FAIL CLOSED</text>
  <text class="label" x="58" y="425">Warn-only gates teach; enforce gates protect</text>
  <text class="sub" x="58" y="455">Critical and High findings exit 1 - Environment checks pause deploy - Admission rejects out-of-band</text>
  <text class="sub" x="58" y="480">Pair with OIDC deploy so the pipeline identity is short-lived and scoped</text>
</svg>
