<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title">
  <title id="title">Private Linux VM path</title>
  <style>
    .bg { fill: #f0f3f7; }
    .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
    .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
    .panel-ink { fill: #101820; }
    .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 22px; font-weight: 700; fill: #101820; }
    .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #101820; }
    .sub { font-family: Source Serif 4, Georgia, serif; font-size: 12px; fill: #3d4a5c; }
    .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 11px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
    .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.8; stroke-dasharray: 7 11; }
    .dot { fill: #9a4e1a; }
    .on-ink { fill: #c5d0dc; }
    .on-ink-label { fill: #f0f3f7; }
  </style>

  <rect class="bg" width="960" height="520"/>
  <text class="title" x="40" y="44">Private Linux VM</text>
  <text class="sub" x="40" y="68">No public IP - SSH key - NSG from Bastion subnet only</text>

  <rect class="panel" x="40" y="120" width="180" height="110" rx="3"/>
  <text class="tiny" x="58" y="150">ADMIN PATH</text>
  <text class="label" x="58" y="180">Bastion / jump</text>
  <text class="sub" x="58" y="202">Browser or tunnel</text>

  <path class="wire-accent" d="M220 175 H280"/>
  <polygon points="280,167 292,175 280,183" class="dot"/>

  <rect class="panel-ink" x="300" y="100" width="620" height="360" rx="3"/>
  <text class="tiny on-ink" x="320" y="130">VNET WORKLOAD PATH</text>

  <rect class="panel-accent" x="330" y="160" width="540" height="100" rx="3"/>
  <text class="tiny" x="350" y="190">NSG</text>
  <text class="label" x="350" y="220">Allow TCP 22 from Bastion CIDR</text>
  <text class="sub" x="350" y="242">Deny Internet inbound for SSH</text>

  <path class="wire-accent" d="M600 260 V300"/>
  <polygon points="592,300 600,312 608,300" class="dot"/>

  <rect class="panel" x="330" y="320" width="540" height="110" rx="3"/>
  <text class="tiny" x="350" y="350">VM</text>
  <text class="label on-ink-label" x="350" y="350" style="fill:#101820">vm-linux-private</text>
  <text class="label" x="350" y="380">Private IP only + SSH key</text>
  <text class="sub" x="350" y="404">Public IP = None</text>
</svg>
