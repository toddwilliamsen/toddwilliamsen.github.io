<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title">
  <title id="title">Fail-closed security gate decision</title>
  <style>
    .bg { fill: #f0f3f7; }
    .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
    .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
    .panel-ink { fill: #101820; }
    .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 20px; font-weight: 700; fill: #101820; }
    .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #101820; }
    .label-inv { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 12px; font-weight: 700; fill: #f7f9fb; }
    .sub { font-family: Source Serif 4, Georgia, serif; font-size: 12px; fill: #3d4a5c; }
    .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 11px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
    .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.8; stroke-dasharray: 7 11; }
    .wire { fill: none; stroke: #101820; stroke-width: 1.4; stroke-opacity: 0.35; }
    .dot { fill: #9a4e1a; }
  </style>

  <rect class="bg" width="960" height="420"/>
  <text class="title" x="40" y="40">Fail closed at each gate</text>
  <text class="sub" x="40" y="64">Scan findings and environment checks decide whether deploy is allowed</text>

  <rect class="panel" x="40" y="140" width="200" height="140" rx="3"/>
  <text class="tiny" x="58" y="175">PIPELINE</text>
  <text class="label" x="58" y="210">Build + scan</text>
  <text class="sub" x="58" y="240">SAST - SCA - IaC</text>

  <path class="wire-accent" d="M240 210 H300"/>
  <polygon points="300,202 312,210 300,218" class="dot"/>

  <rect class="panel-accent" x="320" y="120" width="260" height="180" rx="3"/>
  <text class="tiny" x="338" y="155">GATE</text>
  <text class="label" x="338" y="190">Severity threshold</text>
  <text class="sub" x="338" y="220">Critical / High -&gt; fail</text>
  <text class="sub" x="338" y="245">Policy / alerts -&gt; fail</text>
  <text class="sub" x="338" y="270">Pass -&gt; continue</text>

  <path class="wire" d="M580 160 H640"/>
  <path class="wire-accent" d="M580 260 H640"/>

  <rect class="panel-ink" x="660" y="100" width="260" height="100" rx="3"/>
  <text class="tiny" x="678" y="135" style="fill:#c5d0dc">BLOCKED</text>
  <text class="label-inv" x="678" y="165">No deploy</text>
  <text class="sub" x="678" y="188" style="fill:#c5d0dc">Fix findings first</text>

  <rect class="panel" x="660" y="230" width="260" height="100" rx="3"/>
  <text class="tiny" x="678" y="265">ALLOWED</text>
  <text class="label" x="678" y="295">Deploy with OIDC</text>
  <text class="sub" x="678" y="318">Environment + approval</text>
</svg>
