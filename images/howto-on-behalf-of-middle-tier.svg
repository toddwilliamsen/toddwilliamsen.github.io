<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title">
  <title id="title">On-behalf-of middle tier</title>
  <style>
    .bg { fill: #f0f3f7; }
    .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
    .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
    .panel-ink { fill: #101820; }
    .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 20px; font-weight: 700; fill: #101820; }
    .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 12px; font-weight: 700; fill: #101820; }
    .label-inv { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 12px; font-weight: 700; fill: #f7f9fb; }
    .sub { font-family: Source Serif 4, Georgia, serif; font-size: 11px; fill: #3d4a5c; }
    .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 10px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
    .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.8; stroke-dasharray: 7 11; }
    .dot { fill: #9a4e1a; }
  </style>
  <rect class="bg" width="960" height="480"/>
  <text class="title" x="40" y="40">On-Behalf-Of for a Middle-Tier API</text>
  <text class="sub" x="40" y="64">User token in - OBO exchange - downstream token out (user context preserved)</text>

  <rect class="panel" x="40" y="160" width="150" height="100" rx="3"/>
  <text class="tiny" x="58" y="190">CLIENT</text>
  <text class="label" x="58" y="220">User token</text>

  <path class="wire-accent" d="M190 210 H240"/>
  <polygon points="240,202 252,210 240,218" class="dot"/>

  <rect class="panel-accent" x="260" y="130" width="220" height="160" rx="3"/>
  <text class="tiny" x="280" y="160">MIDDLE TIER</text>
  <text class="label" x="280" y="190">Your API</text>
  <text class="sub" x="280" y="220">Receives user AT</text>
  <text class="sub" x="280" y="245">Calls OBO grant</text>

  <path class="wire-accent" d="M480 210 H530"/>
  <polygon points="530,202 542,210 530,218" class="dot"/>

  <rect class="panel-ink" x="550" y="120" width="220" height="180" rx="3"/>
  <text class="tiny" x="570" y="150" style="fill:#c5d0dc">ENTRA</text>
  <text class="label-inv" x="570" y="185">OBO token</text>
  <text class="sub" x="570" y="220" style="fill:#c5d0dc">grant_type=...</text>
  <text class="sub" x="570" y="245" style="fill:#c5d0dc">on_behalf_of</text>

  <path class="wire-accent" d="M660 300 V340"/>
  <polygon points="652,340 660,352 668,340" class="dot"/>

  <rect class="panel" x="550" y="360" width="370" height="80" rx="3"/>
  <text class="tiny" x="570" y="390">DOWNSTREAM</text>
  <text class="label" x="570" y="420">Graph / second API (user delegated)</text>
</svg>
