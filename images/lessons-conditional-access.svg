<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title">
  <title id="title">Conditional Access policy loop</title>
  
<style>
  .bg { fill: #f0f3f7; }
  .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
  .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
  .panel-ink { fill: #101820; }
  .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 20px; font-weight: 700; fill: #101820; }
  .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 12px; font-weight: 700; fill: #101820; }
  .label-inv { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 12px; font-weight: 700; fill: #f7f9fb; }
  .sub { font-family: Source Serif 4, Georgia, serif; font-size: 11px; fill: #3d4a5c; }
  .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 10px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
  .wire { fill: none; stroke: #101820; stroke-width: 1.3; stroke-opacity: 0.3; }
  .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.7; }

  .wire-accent, .flow {
    stroke-dasharray: 7 11;
    animation: viz-flow 2.8s linear infinite;
  }
  .wire {
    stroke-dasharray: 3 9;
    animation: viz-flow 9s linear infinite;
  }
  .panel-accent, .dot, .node-pulse {
    animation: viz-pulse 3.2s ease-in-out infinite;
  }
  @keyframes viz-flow {
    to { stroke-dashoffset: -72; }
  }
  @keyframes viz-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  @media (prefers-reduced-motion: reduce) {
    .wire-accent, .flow, .wire, .panel-accent, .dot, .node-pulse { animation: none; }
  }

</style>

  <rect class="bg" width="960" height="400"/>
  
  <text class="title" x="40" y="44">Lesson: Conditional Access is policy, not a checkbox</text>
  <text class="sub" x="40" y="68">Signal in → decision → enforce — exclusions age into permanent holes</text>
  <rect class="panel" x="40" y="120" width="200" height="160" rx="3"/>
  <text class="tiny" x="60" y="150">SIGNALS</text>
  <text class="label" x="60" y="180">User / group</text>
  <text class="sub" x="60" y="208">Device compliance</text>
  <text class="sub" x="60" y="232">Location · risk</text>
  <text class="sub" x="60" y="256">App / client app</text>
  <path class="wire-accent" d="M240 200 H300"><animate attributeName="stroke-dashoffset" values="0;-72" dur="2.8s" repeatCount="indefinite"/></path>
  <rect class="panel-accent" x="300" y="140" width="220" height="120" rx="3"/>
  <text class="tiny" x="320" y="170">CA POLICY</text>
  <text class="label" x="320" y="205">Grant / block / session</text>
  <text class="sub" x="320" y="235">MFA · compliant device</text>
  <path class="wire-accent" d="M520 200 H580"><animate attributeName="stroke-dashoffset" values="0;-72" dur="2.8s" repeatCount="indefinite"/></path>
  <rect class="panel" x="580" y="120" width="340" height="160" rx="3"/>
  <text class="tiny" x="600" y="150">OUTCOMES</text>
  <text class="label" x="600" y="180">Cloud apps protected</text>
  <text class="sub" x="600" y="208">Admin portals hardened</text>
  <text class="sub" x="600" y="232">Break-glass monitored</text>
  <text class="sub" x="600" y="256">Exclusions time-boxed</text>

</svg>
