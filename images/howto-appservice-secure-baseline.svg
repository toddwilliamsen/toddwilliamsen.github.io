<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title">
  <title id="title">Secure App Service baseline</title>
  <style>
    .bg { fill: #f0f3f7; }
    .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
    .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
    .panel-ink { fill: #101820; }
    .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 20px; font-weight: 700; fill: #101820; }
    .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 12px; font-weight: 700; fill: #101820; }
    .label-inv { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 12px; font-weight: 700; fill: #f7f9fb; }
    .sub { font-family: Source Serif 4, Georgia, serif; font-size: 11px; fill: #3d4a5c; }
    .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 10px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
  </style>
  <rect class="bg" width="960" height="480"/>
  <text class="title" x="40" y="40">Secure App Service Baseline Hardening</text>
  <text class="sub" x="40" y="64">HTTPS only, TLS min, identity, secrets, networking, logging - one checklist</text>

  <rect class="panel-ink" x="40" y="100" width="880" height="340" rx="3"/>
  <text class="tiny" x="60" y="130" style="fill:#c5d0dc">HARDENING LAYERS</text>

  <rect class="panel-accent" x="70" y="155" width="250" height="240" rx="3"/>
  <text class="tiny" x="90" y="185">IDENTITY</text>
  <text class="label" x="90" y="215">Entra + MI</text>
  <text class="sub" x="90" y="245">No local auth</text>
  <text class="sub" x="90" y="270">KV references</text>
  <text class="sub" x="90" y="295">Least privilege</text>

  <rect class="panel" x="350" y="155" width="250" height="240" rx="3"/>
  <text class="tiny" x="370" y="185">PLATFORM</text>
  <text class="label" x="370" y="215">HTTPS / TLS 1.2+</text>
  <text class="sub" x="370" y="245">FTPS off / SCM lock</text>
  <text class="sub" x="370" y="270">Slots + sticky</text>
  <text class="sub" x="370" y="295">Managed certs</text>

  <rect class="panel" x="630" y="155" width="250" height="240" rx="3"/>
  <text class="tiny" x="650" y="185">NETWORK + LOGS</text>
  <text class="label" x="650" y="215">Access restrictions</text>
  <text class="sub" x="650" y="245">Private endpoint</text>
  <text class="sub" x="650" y="270">Diagnostic settings</text>
  <text class="sub" x="650" y="295">App Insights</text>
</svg>
