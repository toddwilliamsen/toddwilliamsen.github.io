<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title">
  <title id="title">Azure Policy audit then deny</title>
  <style>
    .bg { fill: #f0f3f7; }
    .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
    .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
    .panel-ink { fill: #101820; }
    .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 22px; font-weight: 700; fill: #101820; }
    .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #101820; }
    .sub { font-family: Source Serif 4, Georgia, serif; font-size: 12px; fill: #3d4a5c; }
    .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 11px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
    .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.8; stroke-dasharray: 7 11; }
    .dot { fill: #9a4e1a; }
  </style>

  <rect class="bg" width="960" height="520"/>
  <text class="title" x="40" y="44">Policy: Audit Then Deny</text>
  <text class="sub" x="40" y="68">Assign Audit - review compliance - remediate - flip to Deny</text>

  <rect class="panel" x="40" y="140" width="200" height="140" rx="3"/>
  <text class="tiny" x="58" y="170">STEP 1</text>
  <text class="label" x="58" y="200">Assign Audit</text>
  <text class="sub" x="58" y="224">Built-in definition</text>
  <text class="sub" x="58" y="246">Subscription scope</text>

  <path class="wire-accent" d="M240 210 H290"/>
  <polygon points="290,202 302,210 290,218" class="dot"/>

  <rect class="panel-accent" x="310" y="140" width="200" height="140" rx="3"/>
  <text class="tiny" x="328" y="170">STEP 2</text>
  <text class="label" x="328" y="200">Compliance</text>
  <text class="sub" x="328" y="224">List non-compliant</text>
  <text class="sub" x="328" y="246">Fix or exempt</text>

  <path class="wire-accent" d="M510 210 H560"/>
  <polygon points="560,202 572,210 560,218" class="dot"/>

  <rect class="panel" x="580" y="140" width="200" height="140" rx="3"/>
  <text class="tiny" x="598" y="170">STEP 3</text>
  <text class="label" x="598" y="200">Flip Deny</text>
  <text class="sub" x="598" y="224">Same assignment</text>
  <text class="sub" x="598" y="246">Change effect</text>

  <path class="wire-accent" d="M780 210 H830"/>
  <polygon points="830,202 842,210 830,218" class="dot"/>

  <rect class="panel-ink" x="40" y="330" width="880" height="130" rx="3"/>
  <text class="tiny" x="60" y="365" style="fill:#c5d0dc">PROOF</text>
  <text class="label" x="60" y="400" style="fill:#f0f3f7">Deliberate non-compliant create must fail</text>
  <text class="sub" x="60" y="430" style="fill:#c5d0dc">Failure on create = control is real - exemptions need owners and end dates</text>
</svg>
