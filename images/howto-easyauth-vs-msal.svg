<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title">
  <title id="title">Easy Auth vs MSAL</title>
  <style>
    .bg { fill: #f0f3f7; }
    .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
    .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
    .panel-ink { fill: #101820; }
    .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 20px; font-weight: 700; fill: #101820; }
    .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #101820; }
    .sub { font-family: Source Serif 4, Georgia, serif; font-size: 12px; fill: #3d4a5c; }
    .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 11px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
  </style>
  <rect class="bg" width="960" height="460"/>
  <text class="title" x="40" y="40">Easy Auth vs MSAL in Code</text>
  <text class="sub" x="40" y="64">Platform auth at the edge vs SDK auth inside the app process</text>

  <rect class="panel-accent" x="40" y="110" width="420" height="300" rx="3"/>
  <text class="tiny" x="60" y="140">EASY AUTH</text>
  <text class="label" x="60" y="175">App Service Authentication</text>
  <text class="sub" x="60" y="210">Configured in portal / ARM</text>
  <text class="sub" x="60" y="235">Redirects before your code</text>
  <text class="sub" x="60" y="260">Headers: X-MS-CLIENT-*</text>
  <text class="sub" x="60" y="300">Great for simple sites</text>
  <text class="sub" x="60" y="325">Less control over tokens</text>

  <rect class="panel" x="500" y="110" width="420" height="300" rx="3"/>
  <text class="tiny" x="520" y="140">MSAL IN CODE</text>
  <text class="label" x="520" y="175">Microsoft.Identity.* / MSAL.js</text>
  <text class="sub" x="520" y="210">You own redirect + silent</text>
  <text class="sub" x="520" y="235">Full token cache control</text>
  <text class="sub" x="520" y="260">Call APIs with scopes</text>
  <text class="sub" x="520" y="300">Needed for complex flows</text>
  <text class="sub" x="520" y="325">OBO, SPA PKCE, etc.</text>
</svg>
