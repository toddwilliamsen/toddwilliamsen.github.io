<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title">
  <title id="title">App Service deployment slots</title>
  <style>
    .bg { fill: #f0f3f7; }
    .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
    .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
    .panel-ink { fill: #101820; }
    .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 20px; font-weight: 700; fill: #101820; }
    .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #101820; }
    .label-inv { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 12px; font-weight: 700; fill: #f7f9fb; }
    .sub { font-family: Source Serif 4, Georgia, serif; font-size: 12px; fill: #3d4a5c; }
    .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 11px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
    .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.8; stroke-dasharray: 7 11; }
    .dot { fill: #9a4e1a; }
  </style>
  <rect class="bg" width="960" height="460"/>
  <text class="title" x="40" y="40">App Service Deployment Slots</text>
  <text class="sub" x="40" y="64">Deploy to staging, warm up, swap into production with sticky settings</text>

  <rect class="panel-ink" x="40" y="110" width="880" height="300" rx="3"/>
  <text class="tiny" x="60" y="140" style="fill:#c5d0dc">ONE APP SERVICE APP</text>

  <rect class="panel-accent" x="80" y="170" width="340" height="180" rx="3"/>
  <text class="tiny" x="100" y="200">PRODUCTION</text>
  <text class="label" x="100" y="235">slot: production</text>
  <text class="sub" x="100" y="265">Live traffic</text>
  <text class="sub" x="100" y="290">Slot-sticky settings</text>

  <path class="wire-accent" d="M430 260 H500"/>
  <polygon points="500,252 512,260 500,268" class="dot"/>
  <text class="tiny" x="440" y="245" style="fill:#c5d0dc">SWAP</text>

  <rect class="panel" x="520" y="170" width="340" height="180" rx="3"/>
  <text class="tiny" x="540" y="200">STAGING</text>
  <text class="label" x="540" y="235">slot: staging</text>
  <text class="sub" x="540" y="265">Deploy + smoke test</text>
  <text class="sub" x="540" y="290">Warmup then swap</text>
</svg>
