<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title">
  <title id="title">Azure subscription hygiene layout</title>
  <style>
    .bg { fill: #f0f3f7; }
    .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
    .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
    .panel-ink { fill: #101820; }
    .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 22px; font-weight: 700; fill: #101820; }
    .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #101820; }
    .sub { font-family: Source Serif 4, Georgia, serif; font-size: 12px; fill: #3d4a5c; }
    .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 11px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
    .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.8; stroke-dasharray: 7 11; }
    .dot { fill: #9a4e1a; }
    .on-ink { fill: #c5d0dc; }
    .on-ink-label { fill: #f0f3f7; }
  </style>

  <rect class="bg" width="960" height="520"/>
  <text class="title" x="40" y="44">Subscription Hygiene - Baseline</text>
  <text class="sub" x="40" y="68">Resource groups, tags, delete locks, budget alerts, RBAC boundaries</text>

  <rect class="panel-ink" x="40" y="100" width="880" height="380" rx="3"/>
  <text class="tiny on-ink" x="60" y="130">SUBSCRIPTION</text>
  <text class="label on-ink-label" x="60" y="158">One clean subscription baseline</text>

  <rect class="panel-accent" x="60" y="180" width="190" height="120" rx="3"/>
  <text class="tiny" x="78" y="208">NET</text>
  <text class="label" x="78" y="238">rg-*-net</text>
  <text class="sub" x="78" y="262">Lock: CanNotDelete</text>

  <rect class="panel" x="270" y="180" width="190" height="120" rx="3"/>
  <text class="tiny" x="288" y="208">COMPUTE</text>
  <text class="label" x="288" y="238">rg-*-compute</text>
  <text class="sub" x="288" y="262">Contributor builders</text>

  <rect class="panel" x="480" y="180" width="190" height="120" rx="3"/>
  <text class="tiny" x="498" y="208">DATA</text>
  <text class="label" x="498" y="238">rg-*-data</text>
  <text class="sub" x="498" y="262">Storage / Key Vault</text>

  <rect class="panel" x="690" y="180" width="190" height="120" rx="3"/>
  <text class="tiny" x="708" y="208">OPS</text>
  <text class="label" x="708" y="238">rg-*-ops</text>
  <text class="sub" x="708" y="262">Logs / budgets</text>

  <path class="wire-accent" d="M480 300 V330"/>
  <polygon points="472,330 480,342 488,330" class="dot"/>

  <rect class="panel-accent" x="60" y="350" width="400" height="100" rx="3"/>
  <text class="tiny" x="78" y="378">TAGS</text>
  <text class="label" x="78" y="408">Owner / Environment / CostCenter</text>
  <text class="sub" x="78" y="430">Apply at RG; enforce later with Policy</text>

  <rect class="panel-accent" x="500" y="350" width="380" height="100" rx="3"/>
  <text class="tiny" x="518" y="378">SPEND GUARD</text>
  <text class="label" x="518" y="408">Monthly budget + alerts</text>
  <text class="sub" x="518" y="430">50% / 90% / 100% thresholds</text>
</svg>
