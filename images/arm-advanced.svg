<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title">
  <title id="title">Advanced ARM patterns</title>
  
<style>
  .bg { fill: #f0f3f7; }
  .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
  .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
  .panel-ink { fill: #101820; }
  .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 22px; font-weight: 700; fill: #101820; }
  .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #101820; }
  .label-inv { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #f7f9fb; }
  .sub { font-family: Source Serif 4, Georgia, serif; font-size: 12px; fill: #3d4a5c; }
  .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 11px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
  .wire { fill: none; stroke: #101820; stroke-width: 1.4; stroke-opacity: 0.35; }
  .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.8; }
</style>

  <rect class="bg" width="960" height="500"/>
  
  <text class="title" x="40" y="48">Advanced ARM Patterns</text>
  <text class="sub" x="40" y="72">Copy loops · conditions · nested scopes · deployment modes</text>

  <rect class="panel" x="40" y="110" width="280" height="150" rx="3"/>
  <text class="tiny" x="65" y="145">COPY</text>
  <text class="label" x="65" y="180">Repeat resources / properties</text>
  <text class="sub" x="65" y="210">subnets · NICs · role assignments</text>
  <text class="sub" x="65" y="238">serial vs parallel mode</text>

  <rect class="panel" x="340" y="110" width="280" height="150" rx="3"/>
  <text class="tiny" x="365" y="145">CONDITION</text>
  <text class="label" x="365" y="180">Deploy only when needed</text>
  <text class="sub" x="365" y="210">env == prod → diagnostic settings</text>
  <text class="sub" x="365" y="238">avoid empty resources</text>

  <rect class="panel-accent" x="640" y="110" width="280" height="150" rx="3"/>
  <text class="tiny" x="665" y="145">DEPLOYMENT MODE</text>
  <text class="label" x="665" y="180">Incremental vs Complete</text>
  <text class="sub" x="665" y="210">Complete deletes extras in scope</text>
  <text class="sub" x="665" y="238">Use with extreme care</text>

  <rect class="panel-ink" x="40" y="290" width="880" height="150" rx="3"/>
  <text class="tiny" x="70" y="325" style="fill:#c5d0dc">VALIDATION LAYER</text>
  <text class="label-inv" x="70" y="360">What-if → validate → canary subscription → promote</text>
  <text class="sub" x="70" y="395" style="fill:#c5d0dc">Deployment Scripts for bootstrap that ARM cannot express natively</text>
  <text class="sub" x="70" y="423" style="fill:#c5d0dc">Subscription / MG scoped deployments for policy, RBAC, and diagnostics at scale</text>

</svg>
