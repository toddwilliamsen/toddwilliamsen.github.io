<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title">
  <title id="title">Separate app registrations for web and API</title>
  <style>
    .bg { fill: #f0f3f7; }
    .panel { fill: #f7f9fb; stroke: #101820; stroke-width: 1.5; stroke-opacity: 0.35; }
    .panel-accent { fill: #f7f9fb; stroke: #9a4e1a; stroke-width: 2; }
    .panel-ink { fill: #101820; }
    .title { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 20px; font-weight: 700; fill: #101820; }
    .label { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; fill: #101820; }
    .label-inv { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 12px; font-weight: 700; fill: #f7f9fb; }
    .sub { font-family: Source Serif 4, Georgia, serif; font-size: 12px; fill: #3d4a5c; }
    .tiny { font-family: Syne, Avenir Next, Segoe UI, sans-serif; font-size: 11px; font-weight: 600; fill: #6b7a8d; letter-spacing: 0.06em; }
    .wire-accent { fill: none; stroke: #9a4e1a; stroke-width: 1.8; stroke-dasharray: 7 11; }
    .dot { fill: #9a4e1a; }
  </style>
  <rect class="bg" width="960" height="480"/>
  <text class="title" x="40" y="40">Web App + API - Separate App Registrations</text>
  <text class="sub" x="40" y="64">UI client gets tokens for API audience - never share one registration for both</text>

  <rect class="panel" x="40" y="140" width="160" height="100" rx="3"/>
  <text class="tiny" x="58" y="170">USER</text>
  <text class="label" x="58" y="200">Browser</text>

  <path class="wire-accent" d="M200 190 H250"/>
  <polygon points="250,182 262,190 250,198" class="dot"/>

  <rect class="panel-accent" x="270" y="110" width="220" height="160" rx="3"/>
  <text class="tiny" x="290" y="140">CLIENT APP REG</text>
  <text class="label" x="290" y="170">Web UI</text>
  <text class="sub" x="290" y="200">Redirect URIs</text>
  <text class="sub" x="290" y="225">Delegated scopes</text>

  <path class="wire-accent" d="M490 190 H540"/>
  <polygon points="540,182 552,190 540,198" class="dot"/>

  <rect class="panel-ink" x="560" y="100" width="360" height="300" rx="3"/>
  <text class="tiny" x="580" y="130" style="fill:#c5d0dc">API APP REG</text>
  <text class="label-inv" x="580" y="165">Expose an API</text>
  <text class="sub" x="580" y="200" style="fill:#c5d0dc">App ID URI</text>
  <text class="sub" x="580" y="225" style="fill:#c5d0dc">Scopes: access_as_user</text>
  <text class="sub" x="580" y="250" style="fill:#c5d0dc">App roles for app-only</text>
  <text class="sub" x="580" y="290" style="fill:#c5d0dc">Audience = API client ID</text>
  <text class="sub" x="580" y="315" style="fill:#c5d0dc">or App ID URI</text>
  <text class="sub" x="580" y="355" style="fill:#c5d0dc">Validate iss + aud</text>
</svg>
